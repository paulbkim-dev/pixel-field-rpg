<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Pixel Field RPG</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.39.3/dist/galmuri.css">
<style>
html,body{margin:0;height:100%;background:#0d0b14;overflow:hidden;color:#fff;font-family:'Galmuri11','DungGeunMo',monospace;user-select:none}
#wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;box-shadow:0 0 40px #000}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(10,6,20,.55);pointer-events:auto}
.hidden{display:none!important}
h1{font-family:'Galmuri11',monospace;font-size:56px;margin:0;color:#ffe070;text-shadow:4px 4px 0 #7a3b12,8px 8px 0 #140c1c;letter-spacing:4px}
h2{margin:8px 0 26px;font-size:20px;color:#bfe3ff;text-shadow:2px 2px 0 #140c1c}
.ctrl{background:rgba(20,12,28,.85);border:3px solid #ffe070;padding:14px 22px;line-height:1.9;font-size:14px;box-shadow:4px 4px 0 #000}
.ctrl b{color:#ffe070}
.blink{margin-top:24px;font-size:18px;animation:bl 1s steps(2) infinite;text-shadow:2px 2px 0 #000}
.sub{margin-top:10px;font-size:13px;color:#aaa}
@keyframes bl{50%{opacity:0}}
#toast{position:absolute;bottom:16%;left:50%;transform:translateX(-50%);font-size:22px;color:#fff;text-shadow:3px 3px 0 #140c1c;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap;text-align:center}
#toast small{display:block;font-size:13px;color:#ffe070;margin-top:4px}
#toast.show{opacity:1}
.panel{background:#1d1430;border:4px solid #ffe070;box-shadow:6px 6px 0 #000;padding:18px 24px;min-width:340px}
.panel h3{margin:0 0 12px;color:#ffe070;font-size:20px}
.item{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:10px 12px;margin:6px 0;border:2px solid #4a3a6a;cursor:pointer;text-align:left}
.item:hover{border-color:#ffe070;background:#2a1e44}
.item .d{font-size:12px;color:#bbb}
.item .c{color:#ffe070;white-space:nowrap}
.item.no .c{color:#e05050}
.dead h1{color:#e04848;text-shadow:4px 4px 0 #3a0a10,8px 8px 0 #000}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="toast"></div>
<div id="title" class="screen">
  <h1>PIXEL FIELD</h1>
  <h2>픽셀 필드 RPG</h2>
  <div class="ctrl">
    <b>이동</b> WASD / 방향키 &nbsp; <b>공격</b> J / Space (누르고 있으면 연속)<br>
    <b>회전베기</b> K &nbsp; <b>대시(무적)</b> L / Shift &nbsp; <b>포션</b> Q<br>
    <b>상점</b> 상인 근처에서 E &nbsp; <b>소리</b> M<br>
    <span style="color:#9fdcf5">모닥불 근처에선 HP가 회복됩니다. 멀리 갈수록 강한 몹! 북동쪽 끝엔 보스가...</span>
  </div>
  <div class="blink" id="startMsg">Enter 또는 클릭으로 시작</div>
  <div class="sub" id="newMsg"></div>
</div>
<div id="dead" class="screen dead hidden">
  <h1>쓰러졌다...</h1>
  <h2>골드의 절반을 잃었습니다</h2>
  <div class="blink">Enter로 모닥불에서 부활</div>
</div>
<div id="shop" class="screen hidden">
  <div class="panel">
    <h3>떠돌이 상인</h3>
    <div id="gold"></div>
    <div id="shopItems"></div>
    <div class="sub">1 / 2 / 3 또는 클릭으로 구매 · E / Esc 닫기</div>
  </div>
</div>
<script>
'use strict';
// ================= Setup =================
const W=384,H=216,TS=16,MW=128,MH=128,CX=64,CY=64,SEED=7,ZW=12;
const BOSS_T={x:108,y:20};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=W;cv.height=H;
function resize(){let s=Math.min(innerWidth/W,innerHeight/H);if(s>=1)s=Math.floor(s);cv.style.width=W*s+'px';cv.style.height=H*s+'px';ctx.imageSmoothingEnabled=false}
addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=Math.random;
function hash(x,y,s){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,982451653);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,s){return vnoise(x,y,s)*.55+vnoise(x*2,y*2,s+1)*.3+vnoise(x*4,y*4,s+2)*.15}

// ================= Sprite helpers =================
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');fn((x,y,col,ww=1,hh=1)=>{g.fillStyle=col;g.fillRect(x,y,ww,hh)},g);return c}
function outline(c,col=[20,12,28]){const g=c.getContext('2d'),w=c.width,h=c.height,d=g.getImageData(0,0,w,h),s=d.data,o=new Uint8ClampedArray(s);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;if(s[i+3])continue;
    if((x>0&&s[i-4+3])||(x<w-1&&s[i+4+3])||(y>0&&s[i-w*4+3])||(y<h-1&&s[i+w*4+3])){o[i]=col[0];o[i+1]=col[1];o[i+2]=col[2];o[i+3]=255}}
  g.putImageData(new ImageData(o,w,h),0,0);return c}
function flipH(c){return mk(c.width,c.height,(p,g)=>{g.translate(c.width,0);g.scale(-1,1);g.drawImage(c,0,0)})}
const WC=new WeakMap();
function white(c){let w=WC.get(c);if(!w){w=mk(c.width,c.height,(p,g)=>{g.drawImage(c,0,0);g.globalCompositeOperation='source-in';g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height)});WC.set(c,w)}return w}

// ---- hero / humanoids ----
const HC={hair:'#8a4b22',hairL:'#b06a34',hairD:'#5e3216',skin:'#f5c89a',skinD:'#d89a6a',eye:'#20163a',scarf:'#e04848',tun:'#3f78dc',tunD:'#2b55a8',belt:'#6b4626',buckle:'#f2c14e',pant:'#4a3426',pantD:'#33241a',boot:'#2a1c14'};
const MC=Object.assign({},HC,{hair:'#d8d8e0',hairL:'#ffffff',hairD:'#a0a0b0',scarf:'#f2c14e',tun:'#7a4ab0',tunD:'#56328a',pant:'#3a2a50',pantD:'#2a1e3a'});
function heroSprite(dir,f,C,hat){
  return outline(mk(16,16,p=>{
    const y=(f===1||f===3)?1:0,st=f===1?1:f===3?-1:0;
    if(dir<2){const l=st===1?1:0,r=st===-1?1:0;
      p(5,12,C.pant,2,2-l);p(5,14-l,C.boot,2,1);p(9,12,C.pant,2,2-r);p(9,14-r,C.boot,2,1);
    }else{
      if(st===0){p(6,12,C.pant,4,2);p(6,14,C.boot,5,1)}
      else{const fl=st===1;p(fl?5:9,12,C.pantD,2,2);p(fl?4:9,14,C.boot,3,1);p(fl?9:5,12,C.pant,2,2);p(fl?9:4,14,C.boot,3,1)}
    }
    if(dir===0){
      p(5,1+y,C.hair,6,1);p(4,2+y,C.hair,8,3);p(4,5+y,C.hair,1,2);p(11,5+y,C.hair,1,2);p(5,2+y,C.hairL,3,1);
      p(5,5+y,C.skin,6,2);p(6,7+y,C.skin,4,1);p(6,4+y,C.skin);p(9,4+y,C.skin);
      p(6,5+y,C.eye,1,2);p(9,5+y,C.eye,1,2);p(5,7+y,C.skinD);p(10,7+y,C.skinD);
      p(4,8+y,C.scarf,8,1);p(4,9+y,C.tun,8,2);p(4,9+y,C.tunD,1,2);p(11,9+y,C.tunD,1,2);
      p(3,9+y,C.skin,1,2);p(12,9+y,C.skin,1,2);p(4,11+y,C.belt,8,1);p(7,11+y,C.buckle,2,1);
    }else if(dir===1){
      p(5,1+y,C.hair,6,1);p(4,2+y,C.hair,8,5);p(5,7+y,C.hairD,6,1);p(5,2+y,C.hairL,3,1);
      p(4,8+y,C.scarf,8,1);p(4,9+y,C.tun,8,2);p(4,9+y,C.tunD,1,2);p(11,9+y,C.tunD,1,2);
      p(3,9+y,C.skin,1,2);p(12,9+y,C.skin,1,2);p(4,11+y,C.belt,8,1);p(7,9+y,C.scarf,2,2);
    }else{
      p(5,1+y,C.hair,6,1);p(4,2+y,C.hair,8,2);p(4,4+y,C.hair,3,3);p(5,2+y,C.hairL,3,1);
      p(7,4+y,C.skin,5,3);p(7,7+y,C.skin,4,1);p(7,4+y,C.hair,3,1);
      p(10,5+y,C.eye,1,2);p(7,5+y,C.skinD,1,2);
      p(5,8+y,C.scarf,6,1);p(3,8+y+(f%2),C.scarf,2,1);
      p(5,9+y,C.tun,6,2);p(5,9+y,C.tunD,1,2);p(7,9+y,C.tunD,2,1);p(7,10+y,C.skin,2,1);
      p(5,11+y,C.belt,6,1);
    }
    if(hat){p(3,2+y,hat,10,1);p(5,0+y,hat,6,2);p(5,1+y,'#f2c14e',6,1)}
  }));
}
function monSprite(kind,f){
  const g=kind==='gob';
  return outline(mk(16,16,p=>{
    const y=(f===1||f===3)?1:0,st=f===1?1:f===3?-1:0;
    const sk=g?'#74c24e':'#ece6d6',skD=g?'#4f913a':'#b9b2a0';
    if(g){const pant='#6a4420',pantD='#4a2e14',boot='#3a2410';
      if(st===0){p(6,12,pant,4,2);p(6,14,boot,5,1)}
      else{const fl=st===1;p(fl?5:9,12,pantD,2,2);p(fl?4:9,14,boot,3,1);p(fl?9:5,12,pant,2,2);p(fl?9:4,14,boot,3,1)}
      p(5,3+y,sk,6,5);p(3,4+y,sk,2,1);p(2,3+y,sk,1,1);p(4,5+y,sk);p(5,3+y,skD,6,1);
      p(9,5+y,'#ffe040',2,1);p(10,5+y,'#c02020');p(11,6+y,sk);p(8,7+y,skD,3,1);p(9,7+y,'#fff');
      p(5,8+y,'#8a5a2b',6,3);p(5,8+y,'#6a4420',1,3);p(5,10+y,'#4a2e14',6,1);
      p(8,9+y,sk,3,1);p(11,2+y,'#9a6a32',3,4);p(11,2+y,'#c0905a',1,3);p(12,6+y,'#7a4a22',1,4);
    }else{
      if(st===0){p(6,12,sk,1,2);p(9,12,sk,1,2);p(5,14,sk,2,1);p(9,14,sk,2,1)}
      else{const fl=st===1;p(fl?5:9,12,skD,1,2);p(fl?4:9,14,skD,2,1);p(fl?10:6,12,sk,1,2);p(fl?10:5,14,sk,2,1)}
      p(5,2+y,sk,6,5);p(6,7+y,sk,4,1);p(8,4+y,'#20163a',2,2);p(9,5+y,'#ff4040');p(11,5+y,skD);
      p(7,7+y,skD);p(9,7+y,skD);p(5,2+y,'#fff',3,1);
      p(7,8+y,sk,1,4);p(5,9+y,sk,5,1);p(6,11+y,sk,3,1);
      p(8,9+y,skD,1,3);p(9,11+y,'#cfc8b8',4,1);p(12,10+y,'#cfc8b8',1,3);
    }
  }));
}
// ---- slimes / bats ----
function slimeSprite(col,dark,light,f,size,crown){
  return outline(mk(size,size,p=>{
    const s=size/16,w=[11,13,9][f]*s/2,h=[9,7,12][f]*s/2,cx=size/2,by=size-2,cy=by-h;
    for(let y=0;y<size;y++)for(let x=0;x<size;x++){
      if(y+.5>by)continue;const dx=(x+.5-cx)/w,dy=(y+.5-cy)/h;const v=dx*dx+(dy>0?dy*dy*dy*dy:dy*dy);
      if(v<=1){let c=col;if(dy>.45)c=dark;if(dx<-.25&&dy<-.35&&dx>-.75&&dy>-.85)c=light;p(x,y,c)}
    }
    const e=Math.max(1,Math.round(s)),ey=Math.round(cy+h*.05);
    p(Math.round(cx-w*.4),ey,'#20163a',e,2*e);p(Math.round(cx+w*.3),ey,'#20163a',e,2*e);
    p(Math.round(cx-w*.55),Math.round(cy-h*.55),'#ffffff',e,e);
    if(crown){const top=Math.round(cy-h)-1,cw=Math.round(w*0.9),x0=Math.round(cx-cw/2);
      p(x0,top-2,'#f2c14e',cw,3);for(let i=0;i<3;i++)p(x0+Math.round(i*(cw-2)/2),top-5,'#f2c14e',2,3);
      p(x0+Math.round(cw/2)-1,top-1,'#e04848',2,1);p(x0,top-2,'#fff6b0',cw,1)}
  }));
}
function batSprite(col,dark,f){
  return outline(mk(16,16,p=>{
    if(f===0){p(4,5,dark,2,3);p(2,3,dark,2,3);p(1,2,dark,1,3);p(10,5,dark,2,3);p(12,3,dark,2,3);p(14,2,dark,1,3)}
    else{p(4,7,dark,2,3);p(2,9,dark,2,2);p(1,10,dark,1,2);p(10,7,dark,2,3);p(12,9,dark,2,2);p(14,10,dark,1,2)}
    p(6,6,col,4,4);p(7,5,col,2,1);p(7,10,col,2,1);p(6,4,col);p(9,4,col);p(7,7,'#ff4040');p(8,7,'#ff4040');p(7,9,'#fff');
  }));
}
// ---- objects ----
const TP=[{leaf:'#3f9a3e',L:'#5cbc52',D:'#2b6f30',pl:'#2f7a45',pL:'#45985a',pD:'#1f5532'},
          {leaf:'#d0812f',L:'#efaa45',D:'#9a5522',pl:'#4a7a3a',pL:'#5f9450',pD:'#2f5528'},
          {leaf:'#5d5470',L:'#776d8c',D:'#3f3850',pl:'#3c4a48',pL:'#52625e',pD:'#283432'}];
function treeSprite(kind,pal,v){
  return outline(mk(20,30,p=>{
    p(8,20,'#7a4a26',4,9);p(11,20,'#54321a',1,9);p(7,27,'#7a4a26',1,2);p(12,27,'#54321a',1,2);
    if(kind===0){for(let y=0;y<24;y++)for(let x=0;x<20;x++){const dx=(x+.5-10)/9.3,dy=(y+.5-12)/10;let q=dx*dx+dy*dy+(hash(x,y,3+v)-.5)*.3;
      if(q<1){let c=pal.leaf;const s=dx*.6+dy*.8;if(s>.45)c=pal.D;else if(s<-.45)c=pal.L;if(hash(x,y,9+v)<.06)c=pal.L;if(hash(x,y,19+v)<.05)c=pal.D;p(x,y,c)}}}
    else{for(let y=1;y<24;y++){const t=(y-1)%7,l=Math.floor((y-1)/7),hw=1+t*.8+l*1.4;for(let x=0;x<20;x++){const dx=x+.5-10;if(Math.abs(dx)<=hw){p(x,y,dx<-hw*.35?pal.pL:dx>hw*.4?pal.pD:pal.pl)}}}}
  }));
}
const rockSpr=outline(mk(16,16,p=>{for(let y=0;y<16;y++)for(let x=0;x<16;x++){const dx=(x+.5-8)/6.5,dy=(y+.5-10)/4.8;if(dx*dx+dy*dy<1){let c='#8a8f9a';if(dy<-.3)c='#b4b9c4';if(dy>.45)c='#5e626e';p(x,y,c)}}p(7,8,'#5e626e',1,3);p(8,10,'#5e626e',2,1);p(4,8,'#d8dce4',2,1)}));
const swordSpr=outline(mk(8,18,p=>{p(3,2,'#eef3f8',1,9);p(4,2,'#a9b4c6',1,9);p(3,1,'#ffffff');p(1,11,'#f2c14e',6,1);p(1,11,'#b8862e');p(6,11,'#b8862e');p(3,12,'#6b4423',2,3);p(3,15,'#f2c14e',2,1)}));
const boneSpr=outline(mk(9,9,p=>{const c='#eee8d8';p(1,2,c,2,2);p(1,5,c,2,2);p(6,2,c,2,2);p(6,5,c,2,2);p(2,3,c,5,3)}));
const coinSpr=[6,4,2,4].map(w=>outline(mk(10,10,p=>{const x0=5-w/2;p(x0+1,1,'#f2c14e',Math.max(1,w-2),1);p(x0,2,'#f2c14e',w,6);p(x0+1,8,'#f2c14e',Math.max(1,w-2),1);if(w>2){p(x0+1,2,'#fff6b0',1,4);p(x0+w-1,3,'#b8862e',1,5)}})));
const heartSpr=outline(mk(11,10,p=>{const P=['.11.11.','1111111','1111111','.11111.','..111..','...1...'];P.forEach((r,y)=>[...r].forEach((ch,x)=>{if(ch==='1')p(x+2,y+2,'#e04050')}));p(3,3,'#ffb0b8')}));
const potionSpr=outline(mk(10,12,p=>{p(4,1,'#8a5a2b',2,2);p(4,3,'#cfe8ff',2,1);p(2,4,'#e04050',6,6);p(3,10,'#b03040',4,1);p(3,4,'#ffb0b8',1,3);p(2,4,'#cfe8ff',6,1)}));
function shadowSpr(rx,ry){return mk(rx*2,ry*2,p=>{for(let y=0;y<ry*2;y++)for(let x=0;x<rx*2;x++){const dx=(x+.5-rx)/rx,dy=(y+.5-ry)/ry;if(dx*dx+dy*dy<1)p(x,y,'rgba(0,0,0,0.28)')}})}
const SH={s:shadowSpr(5,2),m:shadowSpr(7,3),b:shadowSpr(15,5)};

const SPR={hero:[[],[],[],[]],merchant:[],gob:[[],[]],skel:[[],[]],slime:[],bat:[],king:[],tree:[]};
for(let f=0;f<4;f++){for(const d of[0,1,3])SPR.hero[d][f]=heroSprite(d,f,HC);SPR.hero[2][f]=flipH(SPR.hero[3][f]);
  for(const k of['gob','skel']){SPR[k][0][f]=monSprite(k,f);SPR[k][1][f]=flipH(SPR[k][0][f])}}
SPR.merchant=[heroSprite(0,0,MC,'#5a2f8a'),heroSprite(0,1,MC,'#5a2f8a')];
const SLC=[['#5fd35a','#3a9c3f','#c8f5b8'],['#4aa8ff','#2a6fc0','#cfe9ff'],['#ff5a5a','#b83232','#ffc8c8']];
SLC.forEach((c,i)=>SPR.slime[i]=[0,1,2].map(f=>slimeSprite(c[0],c[1],c[2],f,16)));
SPR.king=[0,1,2].map(f=>slimeSprite('#b05ae0','#7a35a8','#ecc8ff',f,32,true));
[['#6a4a9a','#4a2f70'],['#9a2a3a','#5a1a28']].forEach((c,i)=>SPR.bat[i]=[0,1].map(f=>batSprite(c[0],c[1],f)));
TP.forEach((pal,i)=>SPR.tree[i]=[treeSprite(0,pal,0),treeSprite(1,pal,1),treeSprite(0,pal,5)]);

// ================= Bitmap font (3x5) =================
const FONT={'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001111',

'+':'000010111010000','-':'000000111000000','!':'010010010000010',':':'000010000010000','/':'001001010100100','.':'000000000000010',' ':'000000000000000','x':'000101010101000'};

function updatePlayer(dt){
  P.inv-=dt;P.atkCd-=dt;P.dashCd-=dt;P.spinCd-=dt;
  let ix=(K('KeyD','ArrowRight')?1:0)-(K('KeyA','ArrowLeft')?1:0),iy=(K('KeyS','ArrowDown')?1:0)-(K('KeyW','ArrowUp')?1:0);
  if(ix&&iy){ix*=.7071;iy*=.7071}
  if(P.kx||P.ky){step(P,P.kx*dt,P.ky*dt);const k=Math.max(0,1-dt*10);P.kx*=k;P.ky*=k;if(Math.abs(P.kx)+Math.abs(P.ky)<4)P.kx=P.ky=0}
  if(PR('ShiftLeft','ShiftRight','KeyL')&&P.dashCd<=0&&P.dashT<=0){
    let dx=ix,dy=iy;if(!dx&&!dy){dx=Math.cos(DIRANG[P.dir]);dy=Math.sin(DIRANG[P.dir])}
    P.dashX=dx;P.dashY=dy;P.dashT=.18;P.dashCd=.75;sfx('dash');burst(P.x,P.y-2,'#e8e0d0',6,40,.3)}
  if(P.dashT>0){P.dashT-=dt;step(P,P.dashX*230*dt,P.dashY*230*dt);P.ghostT-=dt;
    if(P.ghostT<=0){P.ghostT=.03;ghosts.push({img:SPR.hero[P.dir][Math.floor(P.anim)%4],x:P.x,y:P.y,life:.25})}}
  else{const sp=P.atkT>0||P.spinT>0?38:78;
    if(ix||iy){step(P,ix*sp*dt,iy*sp*dt);P.moving=true;P.anim+=dt*9;
      if(P.atkT<=0){if(Math.abs(ix)>Math.abs(iy))P.dir=ix<0?2:3;else P.dir=iy<0?1:0}}
    else{P.moving=false;P.anim=0}}
  if(K('KeyJ','Space','KeyZ')&&P.atkT<=0&&P.spinT<=0&&P.atkCd<=0){P.atkT=ATK_DUR;P.atkCd=.3;P.hitSet.clear();sfx('swing')}
  if(PR('KeyK','KeyX')&&P.spinCd<=0&&P.spinT<=0){P.spinT=SPIN_DUR;P.spinCd=4;P.atkT=0;P.hitSet.clear();sfx('spin')}
  if(PR('KeyQ')){if(P.potions>0&&P.hp<P.maxHp){P.potions--;const h=Math.ceil(P.maxHp*.5);P.hp=Math.min(P.maxHp,P.hp+h);sfx('heal');addNum(P.x,P.y-24,'+'+h,'#6aff7a');burst(P.x,P.y-8,'#6aff7a',14,50,.6,-60)}}
  if(P.atkT>0){P.atkT-=dt;const a0=DIRANG[P.dir];
    for(const m of mobs){if(m.dead||P.hitSet.has(m))continue;const mx=m.x-P.x,my=(m.y-m.z-m.r)-(P.y-7),d=Math.hypot(mx,my);
      if(d>20+m.r)continue;let da=Math.atan2(my,mx)-a0;da=Math.atan2(Math.sin(da),Math.cos(da));if(Math.abs(da)>1.4&&d>9)continue;
      P.hitSet.add(m);dmgMob(m,1,Math.atan2(my,mx))}}
  if(P.spinT>0){P.spinT-=dt;
    for(const m of mobs){if(m.dead||P.hitSet.has(m))continue;const mx=m.x-P.x,my=(m.y-m.z-m.r)-(P.y-7),d=Math.hypot(mx,my);
      if(d<28+m.r){P.hitSet.add(m);dmgMob(m,1.6,Math.atan2(my,mx))}}}
  P.x=clamp(P.x,24,MW*16-24);P.y=clamp(P.y,24,MH*16-24);
  if(Math.hypot(P.x-FIRE.x,P.y-FIRE.y)<70&&P.hp<P.maxHp){P.hp=Math.min(P.maxHp,P.hp+P.maxHp*.1*dt);P.regenT-=dt;if(P.regenT<=0){P.regenT=.3;parts.push({x:P.x+(rnd()-.5)*10,y:P.y-4,vx:0,vy:-25,life:.6,max:.6,col:'#6aff7a',sz:1,g:0})}}
  if(Math.hypot(P.x-MERCH.x,P.y-MERCH.y)<26&&PR('KeyE'))openShop();
  const z=zoneOf(P.x,P.y);toastCd-=dt;

}
function updateWorld(dt){
  for(const m of mobs)if(!m.dead&&(m.boss?Math.hypot(m.x-P.x,m.y-P.y)<340:true))updateMob(m,dt);
  for(let i=0;i<mobs.length;i++){const a=mobs[i];if(a.dead||a.boss)continue;for(let j=i+1;j<mobs.length;j++){const b=mobs[j];if(b.dead||b.boss)continue;
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d<10&&d>0){const p=(10-d)*.5/d;step(a,-dx*p,-dy*p,a.type==='bat');step(b,dx*p,dy*p,b.type==='bat')}}}
  mobs=mobs.filter(m=>!m.dead);
  if(bossT>0){bossT-=dt;if(bossT<=0)spawnBoss()}
  for(const p of projs){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=dt*14;if(solidAt(p.x,p.y+4))p.life=0;
    if(!P.dead&&Math.hypot(p.x-P.x,p.y-(P.y-7))<7&&P.inv<=0&&P.dashT<=0){hurtPlayer(p.dmg,p.x,p.y);p.life=0}}

    const dx=P.x-it.x,dy=(P.y-4)-it.y,d=Math.hypot(dx,dy);

  items=items.filter(it=>it.t<40);
  for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;const k=Math.max(0,1-dt*3);p.vx*=k;if(!p.g)p.vy*=k}
  parts=parts.filter(p=>p.life>0);

  for(const g of ghosts)g.life-=dt;ghosts=ghosts.filter(g=>g.life>0);
  if(rnd()<dt*6)parts.push({x:FIRE.x+(rnd()-.5)*6,y:FIRE.y-8,vx:(rnd()-.5)*10,vy:-30-rnd()*20,life:.8,max:.8,col:rnd()<.5?'#ffc23a':'#ff7a1a',sz:1,g:0});
}
function update(dt){
  time+=dt;
  if(PR('KeyM')){muted=!muted;toast(muted?'소리 끔':'소리 켬',900)}
  if(state==='title'){if(PR('Enter','Space'))startGame(false);else if(PR('KeyN')){startGame(true)}camX=P.x-W/2+Math.sin(time*.3)*30;camY=P.y-H/2;return}

  sk.forEach(([k,cd,i])=>{const x=4+i*20,y=H-22;ctx.fillStyle='#140c1c';ctx.fillRect(x-1,y-1,20,20);ctx.fillStyle='#2a1e44';ctx.fillRect(x,y,18,18);
    if(i===0)drawSwordIcon(x+9,y+9);else if(i===1){ctx.strokeStyle='#ffe070';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+9,y+10,5,.3,Math.PI*1.8);ctx.stroke();ctx.fillStyle='#ffe070';ctx.fillRect(x+13,y+4,3,3)}
    else{ctx.fillStyle='#9fdcf5';for(let j=0;j<3;j++)ctx.fillRect(x+4+j*4,y+7,2,5);ctx.fillRect(x+15,y+8,2,3)}
    if(cd>0){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(x,y,18,Math.round(18*clamp(cd,0,1)))}
    txt(k,x+1,y+1,'#fff')});
  // minimap
  const ms=56,mx0=W-ms-4,my0=4,sx=Math.round(P.x/16-ms/2),sy=Math.round(P.y/16-ms/2);
  ctx.fillStyle='#ffe070';ctx.fillRect(mx0-2,my0-2,ms+4,ms+4);ctx.fillStyle='#000';ctx.fillRect(mx0-1,my0-1,ms+2,ms+2);
  const x0=Math.max(0,sx),y0=Math.max(0,sy),x1=Math.min(MW,sx+ms),y1=Math.min(MH,sy+ms);
  ctx.drawImage(mini,x0,y0,x1-x0,y1-y0,mx0+x0-sx,my0+y0-sy,x1-x0,y1-y0);
  const dot=(wx,wy,c,s=1)=>{const tx=Math.floor(wx/16)-sx,ty=Math.floor(wy/16)-sy;if(tx>=0&&ty>=0&&tx<ms&&ty<ms){ctx.fillStyle=c;ctx.fillRect(mx0+tx-(s>>1),my0+ty-(s>>1),s,s)}};
  dot(FIRE.x,FIRE.y,'#ff9a2a',3);for(const m of mobs)dot(m.x,m.y,m.boss?(Math.floor(time*4)%2?'#ff40ff':'#a020a0'):'#ff3030',m.boss?4:1);
  if(Math.floor(time*4)%2)dot(P.x,P.y,'#fff',2);
  const z=zoneOf(P.x,P.y),zn=ZONES[z][1];txt(zn,W-4-tw(zn),my0+ms+5,'#fff');txt(ZONES[z][2],W-4-tw(ZONES[z][2]),my0+ms+12,'#ffe070');
  const boss=mobs.find(m=>m.boss);
  if(boss&&Math.hypot(boss.x-P.x,boss.y-P.y)<260){const bw=160,bx=(W-bw)/2;txt('KING SLIME',(W-tw('KING SLIME'))/2,5,'#ff90ff');bar(bx,13,bw,5,boss.hp/boss.maxHp,'#b05ae0','#2a1040')}
  if(state==='play'&&P.lv===1&&P.xp===0&&time<60){const s='WASD MOVE  J ATTACK';txt(s,(W-tw(s))/2,H-12,'#fff')}
}
function drawSwordIcon(cx,cy){ctx.save();ctx.translate(cx,cy);ctx.rotate(Math.PI/4);ctx.drawImage(swordSpr,-4,-9);ctx.restore()}
function render(){
  ctx.imageSmoothingEnabled=false;
  const mx=MW*16-W,my=MH*16-H;camX=clamp(camX,0,mx);camY=clamp(camY,0,my);
  rcx=Math.round(clamp(camX+(rnd()-.5)*shake*2,0,mx));rcy=Math.round(clamp(camY+(rnd()-.5)*shake*2,0,my));
  ctx.drawImage(ground,rcx,rcy,W,H,0,0,W,H);
  const tx0=Math.floor(rcx/16)-1,ty0=Math.floor(rcy/16)-1,tx1=Math.ceil((rcx+W)/16)+1,ty1=Math.ceil((rcy+H)/16)+2;
  ctx.fillStyle='#e8f6ff';
  for(let ty=Math.max(0,ty0);ty<Math.min(MH,ty1);ty++)for(let tx=Math.max(0,tx0);tx<Math.min(MW,tx1);tx++){const t=map[idx(tx,ty)];
    if(isW(t)){const h=hash(tx,ty,5),ph=(time*.7+h*10)%3;if(ph<.4){const px=SX(tx*16+2+(h*11|0)),py=SY(ty*16+4+(hash(tx,ty,6)*9|0));ctx.fillRect(px,py,ph<.2?1:3,1);if(ph>=.2)ctx.fillRect(px+1,py-1,1,3)}}}
  // fire glow on ground
  ctx.globalCompositeOperation='lighter';const gl=ctx.createRadialGradient(SX(FIRE.x),SY(FIRE.y),2,SX(FIRE.x),SY(FIRE.y),46+Math.sin(time*9)*2);
  gl.addColorStop(0,'rgba(255,150,50,0.35)');gl.addColorStop(1,'rgba(255,120,40,0)');ctx.fillStyle=gl;ctx.fillRect(SX(FIRE.x)-50,SY(FIRE.y)-50,100,100);ctx.globalCompositeOperation='source-over';
  // shadows
  for(const it of items)ctx.drawImage(SH.s,SX(it.x-5),SY(it.y-1));
  for(const m of mobs){const s=m.boss?SH.b:SH.m;ctx.drawImage(s,SX(m.x-s.width/2),SY(m.y-s.height/2))}
  if(!P.dead)ctx.drawImage(SH.m,SX(P.x-7),SY(P.y-3));
  for(const g of ghosts){ctx.globalAlpha=g.life/.25*.45;ctx.drawImage(g.img,SX(g.x-8),SY(g.y-15))}ctx.globalAlpha=1;
  // y-sorted
  const L=[];
  for(let ty=Math.max(0,ty0);ty<Math.min(MH,ty1);ty++)for(let tx=Math.max(0,tx0);tx<Math.min(MW,tx1);tx++)if(map[idx(tx,ty)]===TREE)L.push([ty*16+15,0,tx,ty]);
  for(const m of mobs)L.push([m.y,1,m]);for(const it of items)L.push([it.y,2,it]);L.push([P.y,3]);L.push([FIRE.y,4]);L.push([MERCH.y,5]);for(const p of projs)L.push([p.y+4,6,p]);
  L.sort((a,b)=>a[0]-b[0]);
  for(const e of L){switch(e[1]){
    case 0:drawTree(e[2],e[3]);break;case 1:drawMob(e[2]);break;
    case 2:{const it=e[2];if(it.t>35&&Math.floor(time*8)%2)break;const bob=Math.round(it.z+(it.z===0?Math.sin(time*4+it.x)*1.5+1.5:0));
      const s=it.type==='coin'?coinSpr[Math.floor(time*8+it.x)%4]:it.type==='heart'?heartSpr:potionSpr;ctx.drawImage(s,SX(it.x-s.width/2),SY(it.y-s.height-bob));break}
    case 3:drawPlayer();break;case 4:drawFire();break;case 5:drawMerchant();break;
    case 6:{const p=e[2];ctx.save();ctx.translate(SX(p.x),SY(p.y));ctx.rotate(p.rot);ctx.drawImage(boneSpr,-4,-4);ctx.restore();break}}}
  for(const p of parts){ctx.globalAlpha=clamp(p.life/p.max*1.5,0,1);ctx.fillStyle=p.col;ctx.fillRect(SX(p.x),SY(p.y),p.sz,p.sz)}ctx.globalAlpha=1;
  // darkness
  if(darkness>.01){const px=SX(P.x),py=SY(P.y-8),g=ctx.createRadialGradient(px,py,30,px,py,200);g.addColorStop(0,'rgba(18,8,40,0)');g.addColorStop(1,`rgba(18,8,40,${darkness+.25})`);
    ctx.fillStyle=`rgba(18,8,40,${darkness*.5})`;ctx.fillRect(0,0,W,H);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  for(const n of nums){ctx.globalAlpha=clamp(n.life*3,0,1);txt(n.t,SX(n.x)-tw(n.t,n.sc)/2,SY(n.y),n.col,n.sc)}ctx.globalAlpha=1;
  if(redFlash>0){ctx.fillStyle=`rgba(255,0,0,${redFlash*.6})`;ctx.fillRect(0,0,W,H)}
  if(state!=='title')drawHUD();
}
let last=performance.now();
function frame(now){let dt=clamp((now-last)/1000,0,.05);last=now;
  if(hitstop>0){hitstop-=dt;dt=0}
  update(dt);render();pressed.clear();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
window.__game={P,get mobs(){return mobs},get state(){return state}};
</script>
